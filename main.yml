name: Build Luxuxry Bot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q LuxuxryBot_build_ready.zip -d project
          echo "Isi project:"
          find project -maxdepth 3 -type f | head -50

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        run: |
          BUILD_FILE=$(find project -name build.gradle -type f | head -1)
          if [ -z "$BUILD_FILE" ]; then
            echo "build.gradle tidak ditemukan"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          while [ "$PROJECT_DIR" != "." ] && [ ! -f "$PROJECT_DIR/settings.gradle" ]; do
            PROJECT_DIR=$(dirname "$PROJECT_DIR")
          done
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan di: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuxuxryBot-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
